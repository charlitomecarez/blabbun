name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */5 * *" # every 5 days at midnight UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.KEEP_ALIVE_URL }}/api/keep-alive")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Keep-alive ping failed with status $STATUS"
            exit 1
          fi
