name: Deployment Status

on:
  push:
    branches: [main]

jobs:
  update-deployment-status:
    name: Update GitHub deployment status
    runs-on: ubuntu-latest
    permissions:
      deployments: write

    steps:
      - name: Create deployment — blabbun.com
        id: dep-client
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'blabbun.com',
              description: 'blabbun.com — Cloudflare Workers',
              auto_merge: false,
              required_contexts: [],
            });
            return dep.data.id;

      - name: Create deployment — admin.blabbun.com
        id: dep-admin
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'admin.blabbun.com',
              description: 'admin.blabbun.com — Cloudflare Workers',
              auto_merge: false,
              required_contexts: [],
            });
            return dep.data.id;

      - name: Mark deployments in_progress
        uses: actions/github-script@v7
        with:
          script: |
            const clientId = ${{ steps.dep-client.outputs.result }};
            const adminId = ${{ steps.dep-admin.outputs.result }};

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: clientId,
              state: 'in_progress',
              environment_url: 'https://blabbun.com',
              description: 'Deploying to Cloudflare Workers...',
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: adminId,
              state: 'in_progress',
              environment_url: 'https://admin.blabbun.com',
              description: 'Deploying to Cloudflare Workers...',
            });

      - name: Wait for Cloudflare to finish
        run: sleep 60

      - name: Mark deployments success
        uses: actions/github-script@v7
        with:
          script: |
            const clientId = ${{ steps.dep-client.outputs.result }};
            const adminId = ${{ steps.dep-admin.outputs.result }};

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: clientId,
              state: 'success',
              environment_url: 'https://blabbun.com',
              log_url: 'https://dash.cloudflare.com/ea34ec600104eb55cd5df21faec4d56c/workers/services/view/blabbun-client',
              description: 'Live on Cloudflare Workers',
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: adminId,
              state: 'success',
              environment_url: 'https://admin.blabbun.com',
              log_url: 'https://dash.cloudflare.com/ea34ec600104eb55cd5df21faec4d56c/workers/services/view/blabbun-admin',
              description: 'Live on Cloudflare Workers',
            });
