name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-client:
    name: Deploy client → blabbun.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @blabbun/client build

      - name: Patch generated wrangler config
        working-directory: apps/client/dist/server
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            cfg.custom_domains = [{ pattern: 'blabbun.com' }, { pattern: 'www.blabbun.com' }];
            fs.writeFileSync('wrangler.json', JSON.stringify(cfg));
          "

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/client

  deploy-admin:
    name: Deploy admin → admin.blabbun.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm --filter @blabbun/admin build

      - name: Patch generated wrangler config
        working-directory: apps/admin/dist/server
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wrangler.json', 'utf8'));
            cfg.kv_namespaces = (cfg.kv_namespaces || []).filter(kv => kv.id);
            cfg.custom_domains = [{ pattern: 'admin.blabbun.com' }];
            fs.writeFileSync('wrangler.json', JSON.stringify(cfg));
          "

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/admin
